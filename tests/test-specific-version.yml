name: Test specific version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-biome
        uses: .
        with:
          version: "1.9.4"
      - name: Assert biome is installed
        run: |
          echo "Checking if biome is on PATH..."
          if ! command -v biome >/dev/null 2>&1; then
            echo "FAIL: biome command not found on PATH"
            exit 1
          fi
          echo "PASS: biome found at $(command -v biome)"
      - name: Assert biome version is correct
        run: |
          ACTUAL_VERSION="$(biome --version 2>&1)"
          echo "actual version: $ACTUAL_VERSION"
          if ! echo "$ACTUAL_VERSION" | grep -q "1.9.4"; then
            echo "FAIL: expected version 1.9.4 but got: $ACTUAL_VERSION"
            exit 1
          fi
          echo "PASS: biome version 1.9.4 confirmed"
