name: Test setup-biome with specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "1.9.4"
      - name: Assert biome is installed
        run: |
          echo "Checking biome is on PATH..."
          which biome || { echo "FAIL: biome not found on PATH"; exit 1; }
          echo "PASS: biome found on PATH"
      - name: Assert biome version matches
        run: |
          ACTUAL_VERSION=$(biome --version 2>&1 || true)
          echo "actual version output: $ACTUAL_VERSION"
          if echo "$ACTUAL_VERSION" | grep -q "1.9.4"; then
            echo "PASS: biome version 1.9.4 installed"
          else
            echo "FAIL: expected version 1.9.4 but got: $ACTUAL_VERSION"
            exit 1
          fi
