name: Test basic usage - install latest Biome
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-biome
        uses: .
        with:
          version: latest
      - name: Assert biome is on PATH
        run: |
          echo "Checking biome is available on PATH..."
          if ! command -v biome &>/dev/null; then
            echo "FAIL: biome command not found on PATH"
            exit 1
          fi
          echo "PASS: biome found at $(command -v biome)"
      - name: Assert biome runs successfully
        run: |
          echo "Running biome --version..."
          VERSION_OUTPUT=$(biome --version 2>&1)
          echo "actual: $VERSION_OUTPUT"
          if [ -z "$VERSION_OUTPUT" ]; then
            echo "FAIL: biome --version returned empty output"
            exit 1
          fi
          echo "PASS: biome --version output: $VERSION_OUTPUT"
