name: Test setup-biome with working-dir
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a project directory with package.json pinning biome version
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/working-dir-project"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/working-dir-project/package.json" <<'EOF'
          {
            "name": "test-project",
            "devDependencies": {
              "@biomejs/biome": "1.9.3"
            }
          }
          EOF
          echo "Created package.json with biome 1.9.3"
      - id: action
        uses: .
        with:
          working-dir: "${{ github.workspace }}/tests/fixtures/working-dir-project"
      - name: Assert biome is installed
        run: |
          echo "Checking biome is on PATH..."
          which biome || { echo "FAIL: biome not found on PATH"; exit 1; }
          echo "PASS: biome found on PATH"
      - name: Assert biome version matches package.json
        run: |
          ACTUAL_VERSION=$(biome --version 2>&1 || true)
          echo "actual version output: $ACTUAL_VERSION"
          if echo "$ACTUAL_VERSION" | grep -q "1.9.3"; then
            echo "PASS: biome version 1.9.3 installed (from working-dir package.json)"
          else
            echo "FAIL: expected version 1.9.3 but got: $ACTUAL_VERSION"
            exit 1
          fi
