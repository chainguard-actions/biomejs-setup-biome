name: Test latest version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: setup-biome
        uses: .
        with:
          version: "latest"

      - name: Assert biome is installed and on PATH
        run: |
          echo "Checking biome is available..."
          which biome || { echo "FAIL: biome not found on PATH"; exit 1; }
          echo "PASS: biome found on PATH"

      - name: Assert biome runs successfully
        run: |
          ACTUAL=$(biome --version 2>&1 || true)
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: biome --version returned empty output"
            exit 1
          fi
          echo "PASS: biome is functional"
