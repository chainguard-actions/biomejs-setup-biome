name: Test latest version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-biome
        uses: .
        with:
          version: "latest"
          token: ${{ github.token }}
      - name: Assert biome is installed and on PATH
        run: |
          echo "Checking biome is available..."
          if ! command -v biome &>/dev/null; then
            echo "FAIL: biome command not found on PATH"
            exit 1
          fi
          echo "PASS: biome is on PATH"
      - name: Assert biome reports a version
        run: |
          ACTUAL_VERSION="$(biome --version)"
          echo "actual version output: $ACTUAL_VERSION"
          if [ -z "$ACTUAL_VERSION" ]; then
            echo "FAIL: biome --version returned empty output"
            exit 1
          fi
          echo "PASS: biome reports version: $ACTUAL_VERSION"
      - name: Assert biome can run help
        run: |
          echo "Running biome --help..."
          if ! biome --help &>/dev/null; then
            echo "FAIL: biome --help exited with non-zero status"
            exit 1
          fi
          echo "PASS: biome --help succeeded"
