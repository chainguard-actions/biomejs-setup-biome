name: Test latest version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-biome
        uses: .
        with:
          version: "latest"
      - name: Assert biome is installed
        run: |
          echo "Checking if biome is on PATH..."
          if ! command -v biome >/dev/null 2>&1; then
            echo "FAIL: biome command not found on PATH"
            exit 1
          fi
          echo "PASS: biome found at $(command -v biome)"
      - name: Assert biome is executable and returns a version
        run: |
          ACTUAL_VERSION="$(biome --version 2>&1)"
          echo "actual version output: $ACTUAL_VERSION"
          if [ -z "$ACTUAL_VERSION" ]; then
            echo "FAIL: biome --version returned empty output"
            exit 1
          fi
          if ! echo "$ACTUAL_VERSION" | grep -qiE "biome|[0-9]+\.[0-9]+\.[0-9]+"; then
            echo "FAIL: version output does not look like a valid biome version: $ACTUAL_VERSION"
            exit 1
          fi
          echo "PASS: biome is installed and returns a version"
