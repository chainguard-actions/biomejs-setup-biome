name: Test version detection from npm package-lock.json
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a project directory with package-lock.json pinning biome version
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/npm-project"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/npm-project/package-lock.json" <<'EOF'
          {
            "name": "test-project",
            "lockfileVersion": 3,
            "packages": {
              "node_modules/@biomejs/biome": {
                "version": "1.9.2",
                "resolved": "https://registry.npmjs.org/@biomejs/biome/-/biome-1.9.2.tgz"
              }
            }
          }
          EOF
      - id: setup-biome
        uses: .
        with:
          working-dir: "${{ github.workspace }}/tests/fixtures/npm-project"
      - name: Assert biome is installed
        run: |
          echo "Checking if biome is on PATH..."
          if ! command -v biome >/dev/null 2>&1; then
            echo "FAIL: biome command not found on PATH"
            exit 1
          fi
          echo "PASS: biome found at $(command -v biome)"
      - name: Assert biome version matches package-lock.json
        run: |
          ACTUAL_VERSION="$(biome --version 2>&1)"
          echo "actual version: $ACTUAL_VERSION"
          if ! echo "$ACTUAL_VERSION" | grep -q "1.9.2"; then
            echo "FAIL: expected version 1.9.2 (from package-lock.json) but got: $ACTUAL_VERSION"
            exit 1
          fi
          echo "PASS: biome version 1.9.2 confirmed (detected from package-lock.json)"
