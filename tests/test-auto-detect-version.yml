name: Test auto-detect version from package.json
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-biome
        uses: .
        with:
          token: ${{ github.token }}
          working-dir: "${{ github.workspace }}/tests/fixtures/auto-detect"
      - name: Assert biome is installed and on PATH
        run: |
          echo "Checking biome is available..."
          if ! command -v biome &>/dev/null; then
            echo "FAIL: biome command not found on PATH"
            exit 1
          fi
          echo "PASS: biome is on PATH"
      - name: Assert biome version matches auto-detected version from package.json
        run: |
          ACTUAL_VERSION="$(biome --version)"
          echo "actual version output: $ACTUAL_VERSION"
          if ! echo "$ACTUAL_VERSION" | grep -q "1.8.3"; then
            echo "FAIL: expected auto-detected version 1.8.3 but got: $ACTUAL_VERSION"
            exit 1
          fi
          echo "PASS: biome version 1.8.3 was auto-detected and installed"
