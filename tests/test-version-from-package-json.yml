name: Test version detection from package.json
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create package.json with pinned biome version
        run: |
          mkdir -p /tmp/test-project
          cat > /tmp/test-project/package.json <<'EOF'
          {
            "name": "test-project",
            "devDependencies": {
              "@biomejs/biome": "1.9.3"
            }
          }
          EOF
          echo "Created package.json:"
          cat /tmp/test-project/package.json

      - name: Setup Biome with version from package.json
        id: action
        uses: .
        with:
          token: ${{ github.token }}
          working-dir: /tmp/test-project

      - name: Assert biome is available in PATH
        run: |
          echo "Checking biome is in PATH..."
          if ! command -v biome &>/dev/null; then
            echo "FAIL: biome command not found in PATH"
            exit 1
          fi
          echo "PASS: biome found at $(command -v biome)"

      - name: Assert biome version matches package.json version
        run: |
          ACTUAL_VERSION=$(biome --version 2>&1 || true)
          echo "actual version output: $ACTUAL_VERSION"
          if ! echo "$ACTUAL_VERSION" | grep -q "1.9.3"; then
            echo "FAIL: expected version 1.9.3 (from package.json) but got: $ACTUAL_VERSION"
            exit 1
          fi
          echo "PASS: biome version 1.9.3 confirmed (detected from package.json)"
