name: Test version detection from package.json
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a project directory with package.json pinning biome version
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/pkg-project"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/pkg-project/package.json" <<'EOF'
          {
            "name": "test-project",
            "devDependencies": {
              "@biomejs/biome": "1.8.3"
            }
          }
          EOF
      - id: setup-biome
        uses: .
        with:
          working-dir: "${{ github.workspace }}/tests/fixtures/pkg-project"
      - name: Assert biome is installed
        run: |
          echo "Checking if biome is on PATH..."
          if ! command -v biome >/dev/null 2>&1; then
            echo "FAIL: biome command not found on PATH"
            exit 1
          fi
          echo "PASS: biome found at $(command -v biome)"
      - name: Assert biome version matches package.json
        run: |
          ACTUAL_VERSION="$(biome --version 2>&1)"
          echo "actual version: $ACTUAL_VERSION"
          if ! echo "$ACTUAL_VERSION" | grep -q "1.8.3"; then
            echo "FAIL: expected version 1.8.3 (from package.json) but got: $ACTUAL_VERSION"
            exit 1
          fi
          echo "PASS: biome version 1.8.3 confirmed (detected from package.json)"
