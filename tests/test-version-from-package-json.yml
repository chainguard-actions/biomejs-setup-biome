name: Test version detection from package.json
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create project directory with package.json
        run: |
          mkdir -p /tmp/test-project
          cat > /tmp/test-project/package.json <<'EOF'
          {
            "name": "test-project",
            "devDependencies": {
              "@biomejs/biome": "1.8.3"
            }
          }
          EOF
          echo "Created package.json with biome 1.8.3"
      - id: setup-biome
        uses: .
        with:
          working-dir: /tmp/test-project
      - name: Assert biome is on PATH
        run: |
          echo "Checking biome is available on PATH..."
          if ! command -v biome &>/dev/null; then
            echo "FAIL: biome command not found on PATH"
            exit 1
          fi
          echo "PASS: biome found at $(command -v biome)"
      - name: Assert biome version matches package.json
        run: |
          VERSION_OUTPUT=$(biome --version 2>&1)
          echo "actual: $VERSION_OUTPUT"
          if echo "$VERSION_OUTPUT" | grep -q "1.8.3"; then
            echo "PASS: biome version 1.8.3 confirmed (from package.json)"
          else
            echo "FAIL: expected version 1.8.3 but got: $VERSION_OUTPUT"
            exit 1
          fi
