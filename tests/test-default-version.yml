name: Test default version install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: setup
        uses: .
        with:
          version: "latest"

      - name: Assert biome is in PATH
        run: |
          if ! command -v biome &>/dev/null; then
            echo "FAIL: biome not found in PATH"
            exit 1
          fi
          echo "PASS: biome found at $(command -v biome)"

      - name: Assert biome runs successfully
        run: |
          OUTPUT=$(biome --version 2>&1 || true)
          echo "biome version output: $OUTPUT"
          if [ -z "$OUTPUT" ]; then
            echo "FAIL: biome --version produced no output"
            exit 1
          fi
          echo "PASS: biome is functional"
